<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS V9 — Test</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050c;color:#d9faff;font-family:system-ui,sans-serif}
#hud{position:fixed;inset:0;border:0;width:100%;height:100%;display:block;background:#01050c}
#toggle{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:50;width:46px;height:46px;border-radius:12px;border:1px solid #00eaff;background:rgba(1,10,20,.88);color:#d9faff;font-size:23px;box-shadow:0 0 18px rgba(0,234,255,.25)}
#drawer{position:fixed;z-index:49;top:0;left:0;bottom:0;width:min(88vw,360px);padding:78px 16px 18px;box-sizing:border-box;background:linear-gradient(160deg,rgba(2,15,28,.98),rgba(1,7,14,.98));border-right:1px solid rgba(0,234,255,.35);transform:translateX(-105%);transition:transform .2s ease;overflow:auto;box-shadow:12px 0 40px rgba(0,0,0,.45)}
#drawer.open{transform:translateX(0)}
#drawer h2{margin:0 0 14px;font-size:17px;letter-spacing:2px;color:#fff}
#drawer section{border:1px solid rgba(0,234,255,.2);border-radius:10px;padding:11px;margin-bottom:10px;background:rgba(0,40,70,.18)}
#drawer label{display:block;font-size:10px;letter-spacing:1.3px;color:#80c9dc;margin:0 0 5px;text-transform:uppercase}
#drawer input{width:100%;box-sizing:border-box;height:40px;margin:0 0 8px;border-radius:7px;border:1px solid rgba(0,234,255,.28);background:rgba(0,0,0,.35);color:#fff;padding:0 9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row button,.cat button{min-height:38px;border-radius:7px;border:1px solid rgba(0,234,255,.3);background:rgba(0,120,180,.1);color:#d9faff;font-weight:600}
button{cursor:pointer;touch-action:manipulation}.danger{border-color:rgba(255,49,88,.5)!important;color:#ff9bad!important}
#conn{font-size:11px;line-height:1.5;margin-top:8px;color:#ffb000}#conn.ok{color:#39ff88}#conn.err{color:#ff6b86}
#cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cat button{text-align:left;font-size:9px;padding:7px}.cat small{display:block;opacity:.55;margin-top:2px}
#toast{position:fixed;z-index:60;bottom:max(14px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90vw;padding:9px 13px;border-radius:9px;background:rgba(1,12,22,.94);border:1px solid rgba(0,234,255,.35);font-size:11px;display:none}
#toast.show{display:block}
</style>
</head>
<body>
<iframe id="hud" src="../index.html" title="JARVIS V9 HUD"></iframe>
<button id="toggle" aria-label="Menu">☰</button>
<aside id="drawer">
<h2>JARVIS V9</h2>
<section>
<label>Home Assistant URL</label>
<input id="haUrl" type="url" placeholder="https://homeassistant.local:8123" autocomplete="off">
<label>Token longue durée</label>
<input id="haToken" type="password" placeholder="Colle ton token ici" autocomplete="off">
<div class="row"><button id="connect">CONNEXION</button><button id="test">TEST HA</button></div>
<div id="conn">Non connecté</div>
</section>
<section>
<div class="row"><button id="refresh">↻ ACTUALISER</button><button id="self">SELF-TEST</button></div>
<div class="row" style="margin-top:7px"><button id="listen">🎤 ÉCOUTER</button><button id="sat">🎙️ IPHONE</button></div>
<div class="row" style="margin-top:7px"><button id="mute" class="danger">🔇 MUTE</button><button id="clear" class="danger">VIDER SÉLECTION</button></div>
</section>
<section>
<label>Catégories V9</label>
<div id="cats"><div class="cat"><button data-cat="light">💡 Lumières<small>0 entité</small></button></div><div class="cat"><button data-cat="climate">🌡️ Climat<small>0 entité</small></button></div><div class="cat"><button data-cat="media">🎵 Médias<small>0 entité</small></button></div><div class="cat"><button data-cat="security">🔐 Sécurité<small>0 entité</small></button></div><div class="cat"><button data-cat="energy">⚡ Énergie<small>0 entité</small></button></div><div class="cat"><button data-cat="cover">🪟 Volets<small>0 entité</small></button></div><div class="cat"><button data-cat="switch">🔌 Interrupteurs<small>0 entité</small></button></div><div class="cat"><button data-cat="sensor">📊 Capteurs<small>0 entité</small></button></div><div class="cat"><button data-cat="fan">🌀 Ventilation<small>0 entité</small></button></div><div class="cat"><button data-cat="scene">🎬 Scènes<small>0 entité</small></button></div><div class="cat"><button data-cat="automation">⚙️ Automations<small>0 entité</small></button></div><div class="cat"><button data-cat="other">🧩 Autres<small>0 entité</small></button></div></div>
</section>
</aside>
<div id="toast"></div>
<script>
const frame=document.getElementById('hud'),drawer=document.getElementById('drawer'),toast=document.getElementById('toast');
const $=id=>document.getElementById(id);
let token=localStorage.getItem('jarvis_v9_token')||'';
let url=localStorage.getItem('jarvis_v9_url')||'';
$('haToken').value=token;$('haUrl').value=url;
function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),2600)}
function win(){return frame.contentWindow}
async function ha(path,opts={}){if(!url||!token)throw Error('URL et token Home Assistant requis');const r=await fetch(url.replace(/\/$/,'')+path,{...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}});if(!r.ok)throw Error('Home Assistant HTTP '+r.status);return r.status===204?null:r.json()}
async function connect(){url=$('haUrl').value.trim().replace(/\/$/,'');token=$('haToken').value.trim();if(!url||!token){$('conn').textContent='URL + token requis';$('conn').className='err';return}try{await ha('/api/');localStorage.setItem('jarvis_v9_url',url);localStorage.setItem('jarvis_v9_token',token);$('conn').textContent='✓ HOME ASSISTANT CONNECTÉ';$('conn').className='ok';patchFrameFetch();await loadV9();msg('Connexion Home Assistant OK')}catch(e){$('conn').textContent='✕ '+e.message;$('conn').className='err';msg('Connexion impossible : '+e.message)}}
function patchFrameFetch(){try{const w=win();const native=w.fetch.bind(w);w.fetch=async(input,opts={})=>{let u=String(input);if(u.startsWith('/api/'))u=w.location.origin+u; if(u.startsWith(url)){opts={...opts,headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',...(opts.headers||{})}}}return native(u,opts)}}catch(e){}}
async function loadV9(){const w=win();if(!w.JARVIS_V9_LOAD_ALL)return;try{await w.JARVIS_V9_LOAD_ALL();if(w.JARVIS_V9_RUNTIME?.refreshEntities)await w.JARVIS_V9_RUNTIME.refreshEntities();renderCats()}catch(e){msg('Runtime V9 : '+e.message)}}
function renderCats(){const cats=win().JARVIS_V9_RUNTIME?.getCategories?.()||[];for(const c of cats){const b=document.querySelector(`[data-cat="${c.id}"]`);if(b){const s=b.querySelector('small');if(s)s.textContent=(c.count||0)+' entité'+((c.count||0)>1?'s':'')}}}
$('toggle').onclick=()=>drawer.classList.toggle('open');
$('connect').onclick=connect;
$('test').onclick=async()=>{try{await ha('/api/');msg('✓ API Home Assistant répond')}catch(e){msg('✕ '+e.message)}};
$('refresh').onclick=async()=>{try{await loadV9();msg('✓ Entités actualisées')}catch(e){msg('✕ '+e.message)}};
$('self').onclick=async()=>{try{const w=win();await loadV9();const r=w.JARVIS_V9_SELF_TEST?.run?.();msg(r?.ok?'✓ SELF-TEST OK':'✕ SELF-TEST incomplet')}catch(e){msg('✕ Self-test : '+e.message)}};
$('listen').onclick=()=>{try{win().tV?.();drawer.classList.remove('open')}catch(e){msg('Micro indisponible')}};
$('sat').onclick=()=>{try{win().activateJarvisSatellite?.();drawer.classList.remove('open')}catch(e){msg('Satellite indisponible')}};
$('mute').onclick=()=>{try{win().tM?.();}catch(e){msg('Mute indisponible')}};
$('clear').onclick=()=>{try{win().JARVIS_V9_MENU?.clear?.();renderCats();msg('Sélection V9 vidée')}catch(e){msg('Menu V9 indisponible')}};
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const id=b.dataset.cat;const c=win().JARVIS_V9_RUNTIME?.getCategory?.(id)||[];win().JARVIS_V9_MENU?.setCategory?.(id,c.map(e=>e.entity_id));msg(id.toUpperCase()+' : '+c.length+' entités sélectionnées')});
frame.onload=async()=>{patchFrameFetch();if(url&&token)await connect();else msg('Ouvre ☰ pour configurer Home Assistant')};
</script>
</body>
</html>
