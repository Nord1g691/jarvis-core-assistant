<!doctype html><html lang="fr"><meta charset="utf-8"><title>JARVIS V9 — Test runner</title><pre id="result">Chargement…</pre><script>const realFetch=window.fetch;window.HA_URL=window.location.origin;window.HA_TOKEN='v9-self-test';window.fetch=async input=>{const url=String(input);if(url.endsWith('/api/states')||url.includes('/api/services/'))return new Response('[]',{status:200,headers:{'Content-Type':'application/json'}});return realFetch(input)};const load=src=>new Promise((r,j)=>{const s=document.createElement('script');s.src=src;s.async=false;s.onload=r;s.onerror=()=>j(new Error('Impossible de charger '+src));document.head.appendChild(s)});(async()=>{try{await load('loader.js');await window.JARVIS_V9_LOAD_ALL();await load('v9-self-test.js');document.getElementById('result').textContent=JSON.stringify(window.JARVIS_V9_SELF_TEST.run(),null,2)}catch(e){document.getElementById('result').textContent=JSON.stringify({ok:false,error:String(e?.message||e)},null,2)}})();</script>
