<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JARVIS V9 — Live</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}#hud{position:fixed;z-index:9999;top:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}#hud button{pointer-events:auto}#menuBtn{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(0,220,255,.55);background:rgba(2,14,27,.9);color:#d9faff;font-size:19px;cursor:pointer}#status{font-size:9px;letter-spacing:1px;padding:0 9px;height:30px;line-height:30px;border:1px solid rgba(0,220,255,.25);border-radius:15px;background:rgba(2,14,27,.82);pointer-events:none}</style></head><body><div id="hud"><span id="status">HA — DÉCONNECTÉ</span><button id="menuBtn">☰</button></div><iframe id="app" src="index.html"></iframe><script>
const frame=document.getElementById('app'),status=document.getElementById('status');let seq=0;const pending=new Map();
function askParent(message){return new Promise((resolve,reject)=>{const id='p'+(++seq);pending.set(id,{resolve,reject});window.parent.postMessage({source:'jarvis-v9',type:'request',id,message},'*');setTimeout(()=>{if(pending.has(id)){pending.delete(id);reject(new Error('HA bridge timeout'))}},8000)})}
window.addEventListener('message',e=>{if(e.source!==window.parent||e.data?.source!=='jarvis-ha')return;const m=e.data;if(m.type==='ready'){status.textContent='HA — CONNECTÉ';status.title=`${m.entity_count||0} entités`;window.JARVIS_NATIVE_HA={states:m.states||[],entity_count:m.entity_count||0};patchNativeFetch();try{frame.contentWindow.postMessage(m,'*')}catch(_){}}else if(m.type==='result'&&m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);if(m.error)p.reject(new Error(m.error));else p.resolve(m.result)}});
function patchNativeFetch(){const w=frame.contentWindow;if(!w||w.__JARVIS_PARENT_FETCH)return;const original=w.fetch?.bind(w);if(!original)return;w.__JARVIS_PARENT_FETCH=true;w.fetch=async function(input,init={}){const url=typeof input==='string'?input:input.url;let u;try{u=new URL(url,w.location.href)}catch(_){return original(input,init)}if(!u.pathname.startsWith('/api/'))return original(input,init);try{const r=await askParent({type:'http_request',path:u.pathname+u.search,method:String(init.method||'GET').toUpperCase(),body:init.body||null});return new Response(JSON.stringify(r.body??r),{status:r.status||200,headers:{'Content-Type':'application/json'}})}catch(err){return new Response(JSON.stringify({message:err.message}),{status:502,headers:{'Content-Type':'application/json'}})}}}
frame.onload=()=>{patchNativeFetch();window.parent.postMessage({source:'jarvis-v9',type:'hello'},'*');setTimeout(()=>window.parent.postMessage({source:'jarvis-v9',type:'hello'},'*'),500)};window.parent.postMessage({source:'jarvis-v9',type:'hello'},'*');
</script></body></html>
