<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS — Native HA</title>
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}</style>
</head>
<body>
<iframe id="hud" src="v9-live.html?native=1&v=9.3.6"></iframe>
<script>
(()=>{
  'use strict';
  const frame=document.getElementById('hud');
  let seq=0;
  const pending=new Map();
  try{localStorage.setItem('jarvis-v9-ha',JSON.stringify({url:location.origin,token:'__JARVIS_NATIVE_HA__',native:true}));}catch(_){}

  window.addEventListener('message',ev=>{
    if(ev.source!==frame.contentWindow)return;
    const m=ev.data;
    if(!m||m.source!=='jarvis-v9')return;
    if(m.type==='hello'){
      window.parent.postMessage({source:'jarvis-v9',type:'hello'},'*');
      return;
    }
    if(m.type!=='request')return;
    const id=m.id ?? (++seq);
    window.parent.postMessage({source:'jarvis-v9',type:'request',id,message:m.message},'*');
  });

  window.addEventListener('message',ev=>{
    if(ev.source!==window.parent)return;
    const m=ev.data;
    if(!m||m.source!=='jarvis-ha')return;
    if(m.type==='ready'){
      frame.contentWindow.postMessage({source:'jarvis-ha',type:'ready',entity_count:m.entity_count,states:m.states},'*');
      return;
    }
    if(m.type!=='result')return;
    const p=m.id!=null?pending.get(m.id):null;
    if(m.id!=null)pending.delete(m.id);
    if(p){
      if(m.error)p.reject(new Error(typeof m.error==='string'?m.error:(m.error.message||'Home Assistant error')));
      else p.resolve(m.result);
      return;
    }
    frame.contentWindow.postMessage({source:'jarvis-ha',type:'result',id:m.id,result:m.result,error:m.error},'*');
  });

  frame.addEventListener('load',()=>{
    try{
      const w=frame.contentWindow;
      w.document.getElementById('connectBtn')?.remove();
      w.JARVIS_NATIVE_HA=true;
      const originalFetch=w.fetch.bind(w);
      w.fetch=async function(input,init={}){
        let raw=typeof input==='string'?input:input?.url||'';
        let url;
        try{url=new URL(raw,w.location.href)}catch(_){return originalFetch(input,init)}
        if(!url.pathname.startsWith('/api/'))return originalFetch(input,init);
        const method=String(init.method||'GET').toUpperCase();
        let body=init.body;
        if(body&&typeof body!=='string'){try{body=JSON.stringify(body)}catch(_){body=String(body)}}
        const headers={};
        try{new Headers(init.headers||{}).forEach((v,k)=>headers[k]=v)}catch(_){}
        const id=++seq;
        const result=new Promise((resolve,reject)=>pending.set(id,{resolve,reject}));
        window.parent.postMessage({source:'jarvis-v9',type:'request',id,message:{type:'http_request',path:url.pathname+url.search,method,body:body||'',headers}},'*');
        const response=await result;
        const responseBody=response?.body==null?'':(typeof response.body==='string'?response.body:JSON.stringify(response.body));
        return new Response(responseBody,{status:response.status||200,headers:{'Content-Type':'application/json'}});
      };

      // The HUD contains a second iframe (index.html). Its own fetch must use
      // the native wrapper above instead of going directly to GitHub Pages.
      const app=w.document.getElementById('app');
      const bridgeAppFetch=()=>{
        try{
          const aw=app?.contentWindow;
          if(!aw)return;
          const appOriginalFetch=aw.fetch.bind(aw);
          aw.fetch=async function(input,init={}){
            let raw=typeof input==='string'?input:input?.url||'';
            let url;
            try{url=new URL(raw,aw.location.href)}catch(_){return appOriginalFetch(input,init)}
            if(!url.pathname.startsWith('/api/'))return appOriginalFetch(input,init);
            return w.fetch(url.pathname+url.search,init);
          };
        }catch(error){console.error('JARVIS nested iframe bridge:',error)}
      };
      if(app){
        app.addEventListener('load',bridgeAppFetch,{once:false});
        setTimeout(bridgeAppFetch,0);
        setTimeout(bridgeAppFetch,500);
        setTimeout(bridgeAppFetch,1500);
      }

      // Tell the HA panel that the V9 shell is alive so it can push states.
      window.parent.postMessage({source:'jarvis-v9',type:'hello'},'*');
    }catch(error){console.error('JARVIS native wrapper:',error)}
  });
})();
</script>
</body>
</html>
