<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#020b12"><title>JARVIS V4.1</title><style>html,body{margin:0;min-height:100%;background:#01050a;color:#8ff8ff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 50%,#03131d 0,transparent 24%),#01050a}.boot{display:grid;place-items:center;gap:18px}.seed{position:relative;width:18px;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#fff 0 18%,#bfffff 20% 31%,#00eaff 35% 58%,#00eaff22 70%,transparent 74%);box-shadow:0 0 12px #fff8,0 0 26px #00eaff,0 0 70px #00eaff55;animation:ignite .72s cubic-bezier(.12,.9,.18,1) both}.seed:before,.seed:after{content:"";position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;border:1px solid #74f6ff77;transform:translate(-50%,-50%) scale(.2);opacity:0;animation:wave 1.15s .30s ease-out infinite}.seed:after{animation-delay:.66s;border-color:#00eaff44}.label{font:600 8px monospace;letter-spacing:2.6px;color:#7fc8d5;opacity:0;animation:label .35s .42s ease forwards}.sub{margin-top:-10px;font:6px monospace;letter-spacing:1.5px;color:#426f7b;opacity:0;animation:label .35s .58s ease forwards}@keyframes ignite{0%{opacity:0;transform:scale(.05);filter:blur(4px) brightness(4)}32%{opacity:1;transform:scale(.45);filter:blur(0) brightness(2.8)}70%{transform:scale(1.25);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}@keyframes wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(6.8)}}@keyframes label{to{opacity:1}}</style></head><body><div class="boot"><div class="seed"></div><div class="label">NOYAU JARVIS</div><div class="sub">INITIALISATION</div></div><script>(async()=>{try{const r=await fetch('base.html?final=438',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();h=h.replaceAll('v=426','v=438');history.replaceState(null,'','./');document.open();document.write(h);document.close()}catch(e){console.error('JARVIS bootstrap',e);location.replace('base.html?final=438')}})();</script></body></html>
