to{transform:rotate(360deg)}}@keyframes p{50%{transform:scale(1.13);filter:brightness(1.3)}}@keyframes x{from{transform:translateX(-10%)}to{transform:translateX(155%)}}</style></head><body><div class="boot"><div class="bootcore"><i></i><i></i><i></i><b></b></div><div class="boottext"><strong>JARVIS</strong><small>PRÉPARATION DU CORE</small></div><div class="scan"></div></div><script>(async()=>{try{const r=await fetch('base.html?final=437',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();h=h.replaceAll('v=426','v=437');history.replaceState(null,'','./');document.open();document.write(h);document.close()}catch(e){console.error('JARVIS bootstrap',e);location.replace('base.html?final=437')}})();</script></body></html>
