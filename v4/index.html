ess(4)}26%{opacity:1;transform:scale(.38);filter:blur(0) brightness(3.2)}62%{transform:scale(1.32);filter:brightness(1.8)}78%{transform:scale(.92);filter:brightness(1.25)}100%{transform:scale(1);filter:brightness(1)}}@keyframes wave{0%{opacity:.9;transform:translate(-50%,-50%) scale(.18)}100%{opacity:0;transform:translate(-50%,-50%) scale(7.6)}}@keyframes microBuild{0%{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-80deg);filter:blur(3px)}70%{opacity:.9;filter:blur(0)}100%{opacity:.55;transform:translate(-50%,-50%) scale(1) rotate(0)}}@keyframes label{to{opacity:1}}</style></head><body><div class="boot"><div class="seed"><i></i><i></i><i></i></div><div class="label">NOYAU JARVIS</div><div class="sub">INITIALISATION</div></div><script>(async()=>{try{const r=await fetch('base.html?final=448',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let h=await r.text();h=h.replaceAll('v=426','v=448');history.replaceState(null,'','./');document.open();document.write(h);document.close()}catch(e){console.error('JARVIS bootstrap',e);location.replace('base.html?final=448')}})();</script></body></html>
