<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS V9 — Live</title>
<style>
html,body{margin:0;height:100%;background:#02070d;color:#d9faff;font-family:system-ui,sans-serif;overflow:hidden}
#hud{position:fixed;z-index:9999;top:12px;right:12px;display:flex;gap:7px;align-items:center;pointer-events:none}
#hud button{pointer-events:auto}
#menuBtn{width:44px;height:44px;padding:0;border-radius:50%;border:1px solid rgba(0,220,255,.55);background:rgba(2,14,27,.9);color:#d9faff;font-size:19px;cursor:pointer;box-shadow:0 0 16px rgba(0,220,255,.18)}
#menuBtn.open{box-shadow:0 0 24px rgba(0,220,255,.42)}
#status{font-size:9px;letter-spacing:1px;padding:0 9px;height:30px;line-height:30px;border:1px solid rgba(0,220,255,.25);border-radius:15px;background:rgba(2,14,27,.82);pointer-events:none}
#drawer{position:fixed;z-index:10000;top:12px;right:12px;width:min(390px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:rgba(2,12,23,.985);border:1px solid rgba(0,220,255,.4);border-radius:14px;padding:14px;box-shadow:0 20px 70px #000;display:none}
#drawer.open{display:block}
.drawerHead{display:flex;align-items:center;justify-content:space-between;gap:8px}.drawerHead .title{margin:0}.closeX{width:34px;height:34px;border-radius:50%;border:1px solid rgba(0,220,255,.25);background:rgba(0,120,180,.1);color:#d9faff;cursor:pointer}
.row{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0}.row button{flex:1;min-width:105px;height:38px;border-radius:7px;border:1px solid rgba(0,220,255,.3);background:rgba(0,120,180,.12);color:#d9faff;font-weight:700;cursor:pointer}
.title{font-size:11px;letter-spacing:2px;font-weight:900;color:#76dfff;margin:12px 0 8px}.cat{padding:8px;border-top:1px solid rgba(0,220,255,.13);font-size:11px}.small{font-size:9px;opacity:.7}.hint{font-size:10px;opacity:.65;line-height:1.4}
.connection{border:1px solid rgba(0,220,255,.2);border-radius:9px;padding:10px;background:rgba(0,120,180,.07)}
.connectionState{font-size:10px;letter-spacing:1px;margin-bottom:8px}.ok{color:#65ffb4}.bad{color:#ff7c7c}
#logBox{width:100%;height:110px;box-sizing:border-box;resize:vertical;background:#01070d;color:#bfefff;border:1px solid rgba(0,220,255,.2);border-radius:7px;padding:8px;font:10px ui-monospace,SFMono-Regular,Menlo,monospace}
.modal{position:fixed;z-index:10001;inset:0;background:rgba(0,0,0,.72);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.card{width:min(430px,100%);background:#061321;border:1px solid rgba(0,220,255,.45);border-radius:12px;padding:16px;box-shadow:0 20px 60px #000}.card h2{margin:0 0 12px}.card input{width:100%;box-sizing:border-box;height:42px;margin:6px 0;background:#020911;color:#fff;border:1px solid rgba(0,220,255,.25);border-radius:7px;padding:0 10px}.card button{height:40px;margin-top:7px;border-radius:7px;border:1px solid rgba(0,220,255,.4);background:rgba(0,180,255,.12);color:#fff;padding:0 13px;font-weight:700}
iframe{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="hud"><span class="status" id="status">V9 — PRÊT</span><button id="menuBtn" aria-label="Ouvrir le menu JARVIS">☰</button></div>
<div id="drawer">
 <div class="drawerHead"><div class="title">JARVIS V9</div><button class="closeX" id="closeMenu">×</button></div>
 <div class="title">CONNEXION</div>
 <div class="connection"><div id="connectionState" class="connectionState bad">● HOME ASSISTANT — NON CONNECTÉ</div><div class="hint" id="connectionDetail">Aucune connexion validée.</div><div class="row"><button id="connectBtn">⚙ RÉGLAGES / CONNEXION</button><button id="refreshBtn">↻ ACTUALISER</button></div></div>
 <div class="title">JARVIS</div>
 <div class="row"><button id="voice">🎤 ÉCOUTER</button><button id="mute">🔇 MUTE</button><button id="sat">🎙️ IPHONE</button></div>
 <div class="row"><button data-core="idle">AUTO</button><button data-core="listening">ÉCOUTE</button><button data-core="processing">RÉFLEXION</button><button data-core="responding">RÉPONSE</button></div>
 <div class="title">CATÉGORIES</div><div id="cats"><div class="small">Chargement des catégories…</div></div>
 <div class="title">DIAGNOSTIC / LOG</div><textarea id="logBox" readonly></textarea><div class="row"><button id="copyLog">⧉ COPIER LE LOG</button><button id="clearLog">EFFACER</button></div>
 <div class="row"><button id="testBtn">✓ SELF-TEST</button><button id="logout">DÉCONNECTER</button></div>
</div>
<div class="modal" id="modal"><div class="card"><h2>Réglages — Connexion Home Assistant</h2><div class="hint">L’URL et le token restent dans le stockage local de ce navigateur. Aucun token n’est écrit dans le dépôt.</div><input id="haUrl" placeholder="https://homeassistant.local" autocomplete="url"><input id="haToken" placeholder="Long-Lived Access Token" type="password" autocomplete="off"><div class="row"><button id="saveConnect">TESTER ET VALIDER</button><button id="cancel">ANNULER</button></div><div id="result" class="hint"></div></div></div>
<iframe id="app" src="index.html"></iframe>
<script>
const frame=document.getElementById('app'),drawer=document.getElementById('drawer'),modal=document.getElementById('modal');
const $=id=>document.getElementById(id);
let cfg=JSON.parse(localStorage.getItem('jarvis-v9-ha')||'null');
function log(msg){const t=new Date().toLocaleTimeString();$('logBox').value+=`[${t}] ${msg}\n`;$('logBox').scrollTop=$('logBox').scrollHeight}
function cleanUrl(u){return String(u||'').trim().replace(/\/$/,'')}
function setConnection(ok,detail=''){ $('connectionState').className='connectionState '+(ok?'ok':'bad'); $('connectionState').textContent=ok?'● HOME ASSISTANT — CONNECTÉ':'● HOME ASSISTANT — NON CONNECTÉ'; $('connectionDetail').textContent=detail|| (ok?'Connexion validée.':'Aucune connexion validée.'); $('status').textContent=ok?'HA — CONNECTÉ':'HA — DÉCONNECTÉ'; }
if(cfg){$('haUrl').value=cfg.url||'';$('haToken').value=cfg.token||'';setConnection(true,'Configuration enregistrée — validation au prochain test.');log('Configuration HA restaurée depuis ce navigateur.')}else log('JARVIS V9 prêt — aucune connexion HA enregistrée.');
$('menuBtn').onclick=()=>{const open=!drawer.classList.contains('open');drawer.classList.toggle('open',open);$('menuBtn').classList.toggle('open',open)};
$('closeMenu').onclick=()=>{drawer.classList.remove('open');$('menuBtn').classList.remove('open')};
$('connectBtn').onclick=()=>modal.classList.add('open');$('cancel').onclick=()=>modal.classList.remove('open');
function patchFetch(){const w=frame.contentWindow;if(!cfg||!w)return;const original=w.fetch.bind(w);w.fetch=async function(input,init={}){let url=typeof input==='string'?input:input.url;const u=new URL(url,w.location.href);if(u.pathname.startsWith('/api/')){const target=cleanUrl(cfg.url)+u.pathname+u.search;const headers=new Headers(init.headers||{});headers.set('Authorization','Bearer '+cfg.token);headers.set('Content-Type','application/json');log('API HA → '+u.pathname);return fetch(target,{...init,headers})}return original(input,init)}}
async function validateConnection(url,token){const r=await fetch(url+'/api/',{headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);return r}
$('saveConnect').onclick=async()=>{const url=cleanUrl($('haUrl').value),token=$('haToken').value.trim();if(!/^https?:\/\//i.test(url)||!token){$('result').textContent='✗ URL et token requis.';log('Validation refusée : URL ou token manquant.');return}$('result').textContent='Test de connexion…';log('Test HA : '+url+'/api/');try{await validateConnection(url,token);cfg={url,token};localStorage.setItem('jarvis-v9-ha',JSON.stringify(cfg));patchFetch();setConnection(true,'Connexion réellement validée par /api/.');$('result').textContent='✓ Connexion validée et enregistrée.';log('✓ Home Assistant validé.');setTimeout(()=>modal.classList.remove('open'),500);call('testHA');call('jarvis.v9.runtime.refreshEntities');syncCats()}catch(e){setConnection(false,e.message);$('result').textContent='✗ Connexion impossible : '+e.message;log('✗ Échec HA : '+e.message)}};
$('refreshBtn').onclick=async()=>{patchFetch();log('Actualisation demandée.');if(cfg){try{await validateConnection(cfg.url,cfg.token);setConnection(true,'Connexion revalidée.');log('✓ Connexion HA revalidée.')}catch(e){setConnection(false,e.message);log('✗ Revalidation échouée : '+e.message)}}call('testHA');call('jarvis.v9.runtime.refreshEntities');syncCats()};
$('voice').onclick=()=>call('tV');$('mute').onclick=()=>call('tM');$('sat').onclick=()=>call('activateJarvisSatellite');
[...document.querySelectorAll('[data-core]')].forEach(b=>b.onclick=()=>call('setCoreState',b.dataset.core));
$('testBtn').onclick=()=>{const w=frame.contentWindow;try{const ok=!!w.JARVIS_V9_RUNTIME;$('status').textContent=ok?'SELF-TEST — SOCLE CHARGÉ':'SELF-TEST — SOCLE ABSENT';log(ok?'✓ Socle V9 chargé.':'✗ Socle V9 absent.')}catch(e){$('status').textContent='SELF-TEST — ERREUR';log('✗ Self-test : '+e.message)}};
$('logout').onclick=()=>{localStorage.removeItem('jarvis-v9-ha');cfg=null;setConnection(false);$('haUrl').value='';$('haToken').value='';log('Déconnexion HA.');drawer.classList.remove('open');$('menuBtn').classList.remove('open')};
$('copyLog').onclick=async()=>{try{await navigator.clipboard.writeText($('logBox').value);log('✓ Log copié dans le presse-papiers.')}catch(e){$('logBox').select();document.execCommand('copy');log('✓ Log copié.')}};
$('clearLog').onclick=()=>{$('logBox').value='';log('Log effacé.')};
function call(fn,...args){try{const w=frame.contentWindow;if(typeof w[fn]==='function')return w[fn](...args);if(fn==='jarvis.v9.runtime.refreshEntities')return w.JARVIS_V9_RUNTIME?.refreshEntities?.()}catch(e){$('status').textContent='ERREUR — '+e.message;log('✗ '+e.message)}}
function syncCats(){try{const w=frame.contentWindow,cats=w.JARVIS_V9_RUNTIME?.getCategories?.()||[];if(!cats.length)return;$('cats').innerHTML=cats.map(c=>`<div class="cat"><b>${c.icon||'•'} ${c.label||c.id}</b> <span class="small">${c.count||0} entités</span></div>`).join('');log('Catégories synchronisées : '+cats.length)}catch(e){log('Synchronisation catégories en attente.')}}
frame.onload=()=>{patchFetch();setTimeout(()=>syncCats(),300);setTimeout(()=>syncCats(),1500);log('HUD V5 chargé dans le shell V9.')};
</script>
</body></html>
