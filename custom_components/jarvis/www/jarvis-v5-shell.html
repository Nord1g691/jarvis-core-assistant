<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>JARVIS</title>
  <style>
    html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}
    iframe{display:block}
  </style>
</head>
<body>
  <iframe id="jarvis-v5" src="/jarvis_static/v5-original.html?v=3.0.19" allow="microphone;camera;autoplay" title="JARVIS"></iframe>
  <script>
    (() => {
      "use strict";
      const VERSION = "3.0.19";
      const frame = document.getElementById("jarvis-v5");

      const inject = (doc, src, id) => new Promise((resolve) => {
        if (doc.getElementById(id)) {
          resolve(true);
          return;
        }
        const script = doc.createElement("script");
        script.id = id;
        script.src = `${src}?v=${VERSION}`;
        script.async = false;
        script.onload = () => resolve(true);
        script.onerror = () => {
          console.error("JARVIS: failed to load", src);
          resolve(false);
        };
        doc.head.appendChild(script);
      });

      frame.addEventListener("load", async () => {
        const doc = frame.contentDocument;
        if (!doc?.head) return;
        await inject(doc, "/jarvis_static/v9/loader.js", "jarvis-v9-loader");
        await inject(doc, "/jarvis_static/v9/v9-v5-ui.js", "jarvis-v9-v5-ui");
        await inject(doc, "/jarvis_static/v9/native-bridge.js", "jarvis-native-bridge");
      }, { once: true });

      window.addEventListener("message", (event) => {
        if (event.source === frame.contentWindow) {
          window.parent.postMessage(event.data, "*");
        } else if (event.source === window.parent) {
          frame.contentWindow.postMessage(event.data, "*");
        }
      });
    })();
  </script>
</body>
</html>
