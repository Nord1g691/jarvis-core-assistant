<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS V9 — WebSocket Test</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050c;color:#d9faff;font-family:system-ui,sans-serif}#hud{position:fixed;inset:0;width:100%;height:100%;border:0;background:#01050c}#toggle{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:50;width:46px;height:46px;border-radius:12px;border:1px solid #00eaff;background:rgba(1,10,20,.9);color:#d9faff;font-size:23px}#drawer{position:fixed;z-index:49;top:0;left:0;bottom:0;width:min(88vw,360px);padding:78px 16px 18px;box-sizing:border-box;background:rgba(1,9,18,.98);border-right:1px solid rgba(0,234,255,.35);transform:translateX(-105%);transition:.2s;overflow:auto}#drawer.open{transform:translateX(0)}section{border:1px solid rgba(0,234,255,.2);border-radius:10px;padding:11px;margin-bottom:10px;background:rgba(0,40,70,.18)}label{display:block;font-size:10px;color:#80c9dc;margin-bottom:5px;text-transform:uppercase}input{width:100%;box-sizing:border-box;height:40px;margin-bottom:8px;border-radius:7px;border:1px solid rgba(0,234,255,.28);background:rgba(0,0,0,.35);color:#fff;padding:0 9px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.row button,.cat button{min-height:38px;border-radius:7px;border:1px solid rgba(0,234,255,.3);background:rgba(0,120,180,.1);color:#d9faff;font-weight:600}button{cursor:pointer;touch-action:manipulation}.danger{color:#ff9bad!important;border-color:rgba(255,49,88,.5)!important}#conn{font-size:11px;margin-top:8px;color:#ffb000}.ok{color:#39ff88!important}.err{color:#ff6b86!important}#cats{display:grid;grid-template-columns:1fr 1fr;gap:6px}.cat button{text-align:left;font-size:9px;padding:7px}.cat small{display:block;opacity:.55;margin-top:2px}#toast{position:fixed;z-index:60;bottom:14px;left:50%;transform:translateX(-50%);max-width:90vw;padding:9px 13px;border-radius:9px;background:rgba(1,12,22,.95);border:1px solid rgba(0,234,255,.35);font-size:11px;display:none}.show{display:block!important}</style></head><body>
<iframe id="hud" src="./index.html" title="JARVIS V9 HUD"></iframe><button id="toggle">☰</button><aside id="drawer"><h2>JARVIS V9</h2><section><label>Home Assistant URL</label><input id="haUrl" type="url" placeholder="https://homeassistant.local:8123" autocomplete="off"><label>Token longue durée</label><input id="haToken" type="password" placeholder="Colle ton token ici" autocomplete="off"><div class="row"><button id="connect">CONNEXION WS</button><button id="test">TEST WS</button></div><div id="conn">Non connecté</div></section><section><div class="row"><button id="refresh">↻ ACTUALISER</button><button id="self">SELF-TEST</button></div><div class="row" style="margin-top:7px"><button id="listen">🎤 ÉCOUTER</button><button id="sat">🎙️ IPHONE</button></div><div class="row" style="margin-top:7px"><button id="mute" class="danger">🔇 MUTE</button><button id="clear" class="danger">VIDER SÉLECTION</button></div></section><section><label>Catégories V9</label><div id="cats"><div class="cat"><button data-cat="light">💡 Lumières<small>0 entité</small></button></div><div class="cat"><button data-cat="climate">🌡️ Climat<small>0 entité</small></button></div><div class="cat"><button data-cat="media">🎵 Médias<small>0 entité</small></button></div><div class="cat"><button data-cat="security">🔐 Sécurité<small>0 entité</small></button></div><div class="cat"><button data-cat="energy">⚡ Énergie<small>0 entité</small></button></div><div class="cat"><button data-cat="cover">🪟 Volets<small>0 entité</small></button></div><div class="cat"><button data-cat="switch">🔌 Interrupteurs<small>0 entité</small></button></div><div class="cat"><button data-cat="sensor">📊 Capteurs<small>0 entité</small></button></div><div class="cat"><button data-cat="fan">🌀 Ventilation<small>0 entité</small></button></div><div class="cat"><button data-cat="scene">🎬 Scènes<small>0 entité</small></button></div><div class="cat"><button data-cat="automation">⚙️ Automations<small>0 entité</small></button></div><div class="cat"><button data-cat="other">🧩 Autres<small>0 entité</small></button></div></div></section></aside><div id="toast"></div>
<script>const frame=document.getElementById('hud'),drawer=document.getElementById('drawer'),toast=document.getElementById('toast'),$=id=>document.getElementById(id);let url=sessionStorage.getItem('jarvis_v9_url')||'';$('haUrl').value=url;function msg(t){toast.textContent=t;toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>toast.classList.remove('show'),2600)}function win(){return frame.contentWindow}async function loadV9(){const w=win();if(!w.JARVIS_V9_LOAD_ALL)throw Error('Chargeur V9 indisponible');await w.JARVIS_V9_LOAD_ALL()}async function connect(){url=$('haUrl').value.trim().replace(/\/$/,'');const token=$('haToken').value.trim();if(!url||!token){$('conn').textContent='URL + token requis';$('conn').className='err';return}try{await loadV9();await win().JARVIS_V9_CORE.connect(url,token);sessionStorage.setItem('jarvis_v9_url',url);$('conn').textContent='✓ HOME ASSISTANT CONNECTÉ VIA WEBSOCKET';$('conn').className='ok';await refresh();msg('WebSocket Home Assistant OK')}catch(e){$('conn').textContent='✕ '+(e.message||e);$('conn').className='err';msg('Connexion impossible : '+(e.message||e))}}async function refresh(){const w=win();await w.JARVIS_V9_RUNTIME?.refreshEntities?.();renderCats()}async function test(){try{await loadV9();const c=win().JARVIS_V9_CORE;if(c?.connected){msg('✓ WebSocket Home Assistant actif')}else{msg('⚠️ Connecte Home Assistant d’abord')}}catch(e){msg('✕ '+(e.message||e))}}function renderCats(){const cats=win().JARVIS_V9_RUNTIME?.getCategories?.()||[];for(const c of cats){const b=document.querySelector(`[data-cat="${c.id}"]`);if(b){const s=b.querySelector('small');if(s)s.textContent=(c.count||0)+' entité'+((c.count||0)>1?'s':'')}}}$('toggle').onclick=()=>drawer.classList.toggle('open');$('connect').onclick=connect;$('test').onclick=test;$('refresh').onclick=async()=>{try{await refresh();msg('✓ Entités actualisées')}catch(e){msg('✕ '+e.message)}};$('self').onclick=async()=>{try{await loadV9();const r=win().JARVIS_V9_SELF_TEST?.run?.();msg(r?.ok?'✓ SELF-TEST OK':'✕ SELF-TEST incomplet')}catch(e){msg('✕ '+e.message)}};$('listen').onclick=()=>{try{win().tV?.();drawer.classList.remove('open')}catch(e){msg('Micro indisponible')}};$('sat').onclick=()=>{try{win().activateJarvisSatellite?.();drawer.classList.remove('open')}catch(e){msg('Satellite indisponible')}};$('mute').onclick=()=>{try{win().tM?.()}catch(e){msg('Mute indisponible')}};$('clear').onclick=()=>{try{win().JARVIS_V9_MENU?.clear?.();renderCats();msg('Sélection V9 vidée')}catch(e){msg('Menu V9 indisponible')}};document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const id=b.dataset.cat,c=win().JARVIS_V9_RUNTIME?.getCategory?.(id)||[];win().JARVIS_V9_MENU?.setCategory?.(id,c.map(e=>e.entity_id));msg(id.toUpperCase()+' : '+c.length+' entités sélectionnées')});</script></body></html>
