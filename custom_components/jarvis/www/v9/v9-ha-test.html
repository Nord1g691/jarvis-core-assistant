<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JARVIS V9 — HA Test</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#01050c;color:#d9faff;font-family:system-ui,sans-serif}body{padding:16px;box-sizing:border-box}main{max-width:520px;margin:auto}h1{font-size:20px;letter-spacing:2px}section{border:1px solid #16465b;border-radius:10px;padding:12px;margin:10px 0;background:#03111c}label{display:block;font-size:11px;margin:8px 0 4px;color:#8fd7e8}input{width:100%;box-sizing:border-box;height:40px;background:#02080d;border:1px solid #28566a;border-radius:7px;color:#fff;padding:0 9px}button{width:100%;height:42px;margin-top:8px;background:#062335;border:1px solid #16708e;border-radius:7px;color:#d9faff;font-weight:700}#status{margin-top:10px;font-size:12px}#log{white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto;color:#9ed9e8}
</style>
</head>
<body>
<main>
<h1>JARVIS V9 — TEST HA RÉEL</h1>
<section>
<label>URL Home Assistant</label>
<input id="url" type="url" autocomplete="off" placeholder="https://xxxx.ui.nabu.casa">
<label>Token longue durée</label>
<input id="token" type="password" autocomplete="off" placeholder="Token — jamais enregistré">
<button id="connect">TESTER HOME ASSISTANT</button>
<div id="status">En attente</div>
</section>
<section><div id="log">Aucun test lancé.</div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent+=`\n${new Date().toLocaleTimeString()} — ${t}`};
function setStatus(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#39ff88':'#ffb000'}
async function connect(){
 const url=$('url').value.trim().replace(/\/$/,'');
 const token=$('token').value.trim();
 if(!url||!token){setStatus('URL + token requis');return}
 $('log').textContent='Test en cours…';
 try{
  log('Test API Home Assistant…');
  const r=await fetch(url+'/api/',{method:'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},cache:'no-store'});
  const body=await r.text();
  log('HTTP '+r.status);
  if(!r.ok)throw Error('Home Assistant HTTP '+r.status+(body?' — '+body.slice(0,120):''));
  log('✓ API Home Assistant accessible');
  setStatus('✓ HOME ASSISTANT CONNECTÉ',true);
 }catch(e){
  log('✕ '+(e.message||String(e)));
  if(e instanceof TypeError)log('✕ Le navigateur bloque probablement la requête (CORS/réseau/URL).');
  setStatus('✕ TEST ÉCHOUÉ');
 }finally{$('token').value=''}
}
$('connect').onclick=connect;
</script>
</body>
</html>
