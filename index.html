<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JARVIS</title>
  <style>
    html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}
    #hud{position:fixed;inset:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="hud" src="v5-original.html" title="JARVIS V5"></iframe>

  <script>
    (() => {
      "use strict";

      const hud = document.getElementById("hud");
      const version = "9.5.4";

      // Keep the legacy V5 HUD untouched. The V9 loader is initialized once.
      const load = (src) => new Promise((resolve) => {
        if (document.querySelector(`script[data-jarvis-src="${src}"]`)) {
          resolve();
          return;
        }
        const script = document.createElement("script");
        script.src = `${src}?v=${version}`;
        script.dataset.jarvisSrc = src;
        script.onload = resolve;
        script.onerror = () => {
          console.error("JARVIS: failed to load", src);
          resolve();
        };
        document.head.appendChild(script);
      });

      const startV9 = async () => {
        await load("v9/native-bridge.js");
        await load("v9/loader.js");
        await load("v9/launcher.js");
        await load("v9/v9-v5-ui.js");
        await window.JARVIS_V9_LOAD_ALL?.();
      };

      startV9().catch((error) => {
        console.error("JARVIS V9 initialization failed", error);
        window.dispatchEvent(new CustomEvent("jarvis:v9:error", { detail: error }));
      });

      // The native bridge is also injected into the existing V5 iframe when
      // same-origin access is available. The V5 itself is never modified.
      hud.addEventListener("load", () => {
        try {
          const win = hud.contentWindow;
          if (!win || win.document.getElementById("jarvis-native-bridge")) return;

          const script = win.document.createElement("script");
          script.id = "jarvis-native-bridge";
          script.src = `v9/native-bridge.js?v=${version}`;
          win.document.head.appendChild(script);
        } catch (error) {
          console.error("JARVIS native bridge injection failed", error);
        }
      }, { once: true });
    })();
  </script>
</body>
</html>
