<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>JARVIS</title>
  <style>
    html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}
    #hud{position:fixed;inset:0;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <iframe id="hud" src="v5-original.html?v=3.0.19" title="JARVIS"></iframe>
  <script>
    (() => {
      "use strict";
      const VERSION = "3.0.19";
      const hud = document.getElementById("hud");

      const inject = (doc, src, id) => new Promise((resolve) => {
        if (doc.getElementById(id)) {
          resolve(true);
          return;
        }
        const script = doc.createElement("script");
        script.id = id;
        script.src = `${src}?v=${VERSION}`;
        script.async = false;
        script.onload = () => resolve(true);
        script.onerror = () => {
          console.error("JARVIS: failed to load", src);
          resolve(false);
        };
        doc.head.appendChild(script);
      });

      hud.addEventListener("load", async () => {
        const doc = hud.contentDocument;
        if (!doc?.head) return;

        await inject(doc, "v9/loader.js", "jarvis-v9-loader");
        await inject(doc, "v9/v9-v5-ui.js", "jarvis-v9-v5-ui");
        await inject(doc, "v9/native-bridge.js", "jarvis-native-bridge");
      }, { once: true });
    })();
  </script>
</body>
</html>
