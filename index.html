<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020812">
<title>JARVIS V5 + V9</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{--cyan:#00eaff;--cyan2:#008cff;--blue:#0066ff;--green:#39ff88;--red:#ff3158;--orange:#ffb000}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812;color:#fff;font-family:Rajdhani,system-ui,sans-serif}#jarvis-v5-shell{position:fixed;inset:0;display:grid;place-items:center}.v5-orb{width:min(54vw,250px);aspect-ratio:1;border-radius:50%;border:2px solid var(--cyan);box-shadow:0 0 35px #00eaff55,0 0 100px #0066ff22;display:grid;place-items:center;text-align:center;font-family:Orbitron,sans-serif;color:var(--cyan);letter-spacing:3px}.v5-sub{font-size:11px;opacity:.65;margin-top:8px}.jv9-menu{position:fixed!important;right:14px!important;top:calc(env(safe-area-inset-top) + 14px)!important;z-index:2147483646!important}.jv9-launch{width:50px!important;height:50px!important;border-radius:15px!important;border:2px solid var(--cyan)!important;background:#03101dee!important;color:#fff!important;font-size:23px!important;box-shadow:0 0 24px #00eaff66!important}.jv9-panel{position:fixed!important;right:14px!important;top:calc(env(safe-area-inset-top) + 74px)!important;width:min(390px,calc(100vw - 28px))!important;max-height:calc(100dvh - 90px)!important;overflow:auto!important;z-index:2147483645!important;padding:14px!important;border:1px solid #00eaff66!important;border-radius:18px!important;background:#020812f8!important;color:#fff!important;box-shadow:0 20px 70px #000!important}.jv9-panel[hidden]{display:none!important}.jv9-title{font-family:Orbitron,sans-serif;color:var(--cyan);text-align:center;margin-bottom:12px}.jv9-tools,.jv9-cats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.jv9-btn{padding:12px;border-radius:12px;border:1px solid #00eaff33;background:#ffffff0d;color:#fff}.jv9-card{margin-top:8px;padding:11px;border-radius:11px;background:#ffffff0d}.jv9-close{float:right;background:none;border:0;color:#fff;font-size:20px}.jv9-error{color:#ff9aaa;margin-top:8px}</style>
</head>
<body>
<main id="jarvis-v5-shell"><div><div class="v5-orb">JARVIS<div class="v5-sub">V8.9 / V9</div></div></div></main>
<div class="jv9-menu"><button id="jv9-launch" class="jv9-launch" type="button">☰</button><section id="jv9-panel" class="jv9-panel" hidden></section></div>
<script src="v9/loader.js"></script>
<script>
(()=>{'use strict';const launch=document.getElementById('jv9-launch'),panel=document.getElementById('jv9-panel');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const cats=window.JARVIS_V9?.categories||[];panel.innerHTML='<button class="jv9-close" id="j9x">×</button><div class="jv9-title">CATÉGORIES V9</div><div class="jv9-tools"><button class="jv9-btn" id="j9r">↻ Actualiser</button><button class="jv9-btn" id="j9l">▤ Logs</button><button class="jv9-btn" id="j9s">⚙ Connexion</button><button class="jv9-btn" id="j9h">⌂ HUD</button></div><div class="jv9-cats" id="j9cats"></div>';const box=document.getElementById('j9cats');cats.forEach(c=>{const b=document.createElement('button');b.className='jv9-btn';b.innerHTML=`${esc(c.label||c.id)}<small style="display:block;opacity:.6">${window.JARVIS_V9_RUNTIME?.getCategory?.(c.id)?.length||0} entités</small>`;b.onclick=()=>{const es=window.JARVIS_V9_RUNTIME?.getCategory?.(c.id)||[];panel.innerHTML=`<button class="jv9-close" id="j9back">‹</button><div class="jv9-title">${esc(c.label||c.id)}</div>${es.length?es.map(e=>`<div class="jv9-card"><b>${esc(e.attributes?.friendly_name||e.entity_id)}</b><small style="display:block;opacity:.6">${esc(e.state)}</small></div>`).join(''):'<div class="jv9-card">Aucune entité détectée</div>'}`;document.getElementById('j9back').onclick=render};box.appendChild(b)});document.getElementById('j9x').onclick=()=>panel.hidden=true;document.getElementById('j9r').onclick=()=>window.JARVIS_V9_QUICK_ACTIONS?.refresh?.();document.getElementById('j9l').onclick=()=>{panel.innerHTML='<button class="jv9-close" id="j9b">‹</button><div class="jv9-title">LOGS</div><div class="jv9-card"><pre style="white-space:pre-wrap">'+esc(window.JARVIS_V9_LOG?.format?.()||'Aucun log')+'</pre></div>';document.getElementById('j9b').onclick=render};document.getElementById('j9s').onclick=()=>{panel.innerHTML='<button class="jv9-close" id="j9b">‹</button><div class="jv9-title">CONNEXION HOME ASSISTANT</div><div class="jv9-card">'+esc(window.JARVIS_V9_CONNECTION_UI?.view?.().label||'Connexion via V5/V8.9')+'</div><div class="jv9-card">Utilise la connexion Home Assistant déjà fonctionnelle du HUD.</div>';document.getElementById('j9b').onclick=render};document.getElementById('j9h').onclick=()=>panel.hidden=true}launch.onclick=()=>{panel.hidden=!panel.hidden;if(!panel.hidden)render()};})();
</script>
</body></html>
