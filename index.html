<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#020812"><title>JARVIS V9</title><style>:root{--c:#00eaff;--bg:#01050c;--panel:rgba(4,18,31,.82);--text:#d9faff;--muted:#79a8b8;--ok:#39ff88;--danger:#ff3158}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 25%,rgba(0,234,255,.12),transparent 42%),var(--bg);color:var(--text);font-family:system-ui,sans-serif}button{font:inherit;color:var(--text);border:1px solid rgba(0,234,255,.35);background:rgba(0,30,48,.7);border-radius:12px;padding:10px 14px;cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.logo{font-size:28px;font-weight:800;letter-spacing:7px;text-shadow:0 0 18px rgba(0,234,255,.7)}.status{font-size:12px;color:var(--ok);border:1px solid rgba(57,255,136,.25);padding:7px 10px;border-radius:20px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.menu{display:none;background:var(--panel);border:1px solid rgba(0,234,255,.25);border-radius:16px;padding:14px;margin-bottom:16px}.menu.open{display:block}.menu h3{margin:0 0 10px;font-size:14px;color:var(--c)}.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.core{width:min(58vw,300px);height:min(58vw,300px);margin:18px auto;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid rgba(0,234,255,.45);box-shadow:0 0 35px rgba(0,234,255,.16),inset 0 0 45px rgba(0,140,255,.08);font-size:30px;font-weight:800;letter-spacing:5px}.dashboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{background:var(--panel);border:1px solid rgba(0,234,255,.2);border-radius:16px;padding:15px}.card .name{font-weight:700}.card .id,.empty{color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.footer{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}</style></head><body><div class="app"><header class="top"><div class="logo">JARVIS V9</div><div id="status" class="status">V9 CHARGEMENT</div></header><div class="toolbar"><button id="menuBtn">☰ Menu</button><button id="refreshBtn">↻ Actualiser</button><button data-layout="none">◉ Simple</button><button data-layout="bottom">▰ Bas</button><button data-layout="orbital">◌ Orbital</button><a href="v9/v9-test-runner.html"><button>✓ Self-test</button></a></div><section id="menu" class="menu"><h3>MENU V9 — CATÉGORIES</h3><div id="cats" class="cats"></div><div class="actions"><button id="clearBtn">Effacer la sélection</button></div></section><div class="core" id="core">V9</div><section><h2>Tableau de bord</h2><div id="dashboard" class="dashboard"></div></section><div class="footer">Version V9 · interface locale · aucun identifiant d’entité codé en dur</div></div><script src="v9/loader.js"></script><script>(async()=>{const $=id=>document.getElementById(id),safe=(f,d)=>{try{return f()}catch{return d}},status=(t,ok=true)=>{$('status').textContent=t;$('status').style.color=ok?'var(--ok)':'var(--danger)'};try{await window.JARVIS_V9_LOAD_ALL();const bridge=window.JARVIS_V9_BRIDGE;if(!bridge)throw Error('Bridge V9 indisponible');status('V9 PRÊTE');$('menuBtn').onclick=()=>$('menu').classList.toggle('open');$('refreshBtn').onclick=()=>{bridge.refresh();render()};$('clearBtn').onclick=()=>{window.JARVIS_V9_MENU?.clear?.();render()};document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{window.JARVIS_V9_LAYOUT?.write?.(b.dataset.layout);render()});const cats=(window.JARVIS_V9?.categories)||['light','switch','climate','cover','media_player','fan','lock','sensor','binary_sensor','camera'];$('cats').innerHTML=cats.map(c=>`<button data-cat="${c}">${c} ›</button>`).join('');$('cats').querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const c=b.dataset.cat,ids=safe(()=>bridge.getEntities().filter(e=>String(e.entity_id||'').startsWith(c+'.')).map(e=>e.entity_id),[]);window.JARVIS_V9_MENU?.setCategory?.(c,ids);render()});function render(){const m=safe(()=>bridge.buildDashboard(),{cards:{}}),cards=m.cards||{},list=Array.isArray(cards)?cards:Object.values(cards);$('dashboard').innerHTML=list.length?list.map(c=>`<article class="card"><div class="name">${c.name||c.friendly_name||c.entity_id||'Entité'}</div><div class="id">${c.entity_id||''}</div><div>${c.state||c.value||'—'}</div></article>`).join(''):'<div class="card empty">Aucune entité sélectionnée pour le moment. Le menu V9 est opérationnel.</div>'}render()}catch(e){status('V9 ERREUR',false);$('dashboard').innerHTML=`<div class="card">${String(e?.message||e)}</div>`}})();</script></body></html>
