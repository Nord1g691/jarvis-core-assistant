<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#01050c}#hud{position:fixed;inset:0;width:100%;height:100%;border:0}</style></head><body><iframe id="hud" src="v5-original.html"></iframe><script>
const hud=document.getElementById('hud');
