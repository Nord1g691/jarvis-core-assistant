<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS V9 — test</title><style>:root{--c:#00eaff;--g:#39ff88;--r:#ff3158;--bg:#01050c;--t:#d9faff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--t);font-family:Arial,sans-serif}iframe{position:fixed;inset:0;width:100%;height:100%;border:0}button,input{font:inherit}#menuBtn,#connBtn{position:fixed;z-index:20;top:12px;height:46px;border:1px solid #00eaff66;border-radius:10px;background:#010912cc;color:var(--t);backdrop-filter:blur(10px);font-weight:700}#menuBtn{left:12px;width:46px;font-size:22px;color:var(--c)}#connBtn{right:12px;padding:0 13px}.panel{position:fixed;z-index:30;top:12px;right:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;padding:16px;border:1px solid #00eaff55;border-radius:14px;background:#010912f2;backdrop-filter:blur(16px);box-shadow:0 0 30px #00eaff1f;transform:translateX(110%);transition:.2s}.panel.open{transform:none}.title{font-size:16px;font-weight:800;letter-spacing:2px;margin-bottom:10px}.status{font-size:12px;margin:8px 0 12px;color:#79b7c8}.ok{color:var(--g)}.err{color:var(--r)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.b{min-height:40px;border:1px solid #00c8ff4d;border-radius:8px;background:#0078b012;color:var(--t);font-weight:700}.b:active{transform:scale(.97)}.field{width:100%;margin:5px 0;padding:10px;border:1px solid #00eaff44;border-radius:8px;background:#000811;color:var(--t)}.small{font-size:10px;color:#6d9aaa}.cats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.cat{padding:9px;border:1px solid #00eaff26;border-radius:7px;background:#00132199;font-size:11px;text-align:left}.cat span{float:right;color:var(--c)}pre{white-space:pre-wrap;font-size:10px;max-height:180px;overflow:auto;background:#00060c;padding:9px;border-radius:8px}#toast{position:fixed;z-index:40;left:50%;bottom:15px;transform:translate(-50%,20px);opacity:0;padding:9px 14px;border:1px solid #00eaff44;border-radius:20px;background:#010912f2;font-size:11px;transition:.2s}#toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><iframe id="app" src="./index.html"></iframe><button id="menuBtn">☰</button><button id="connBtn">CONNEXION</button><section id="panel" class="panel"><div class="title">JARVIS V9</div><div id="status" class="status">Initialisation…</div><div class="grid"><button class="b" id="connect">📡 CONNECTER</button><button class="b" id="self">🧪 SELF-TEST</button><button class="b" id="refresh">↻ ACTUALISER</button><button class="b" id="clear">✕ DÉCONNECTER</button></div><input id="url" class="field" placeholder="URL Home Assistant — https://..."><input id="token" class="field" type="password" placeholder="Token longue durée Home Assistant"><div class="small">Les identifiants restent dans le stockage local de ce navigateur.</div><div class="title" style="margin-top:16px">Catégories V9</div><div id="cats" class="cats"></div><pre id="log">Aucun test exécuté.</pre></section><div id="toast"></div><script>
const $=id=>document.getElementById(id), app=$('app'), panel=$('panel'), status=$('status'), log=$('log'), cats=$('cats'), toast=$('toast');
const KEY='jarvis-v9-ha'; const files=['loader.js','v9-self-test.js'];
function note(x){toast.textContent=x;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1800)}
function cfg(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}
function save(){localStorage.setItem(KEY,JSON.stringify({url:$('url').value.trim().replace(/\\/$/,''),token:$('token').value.trim()}))}
function setStatus(text,cls=''){status.className='status '+cls;status.textContent=text}
function inject(src){return new Promise((res,rej)=>{if(app.contentWindow.document.querySelector('script[data-v9="'+src+'"]'))return res();const s=app.contentWindow.document.createElement('script');s.src='./v9/'+src;s.async=false;s.dataset.v9=src;s.onload=res;s.onerror=()=>rej(new Error('Chargement V9 impossible: '+src));app.contentWindow.document.head.appendChild(s)})}
async function bootV9(){await inject('loader.js');await app.contentWindow.JARVIS_V9_LOAD_ALL();await inject('v9-self-test.js')}
async function connect(){save();const c=cfg();if(!c.url||!c.token)return setStatus('URL + token requis','err');setStatus('Connexion Home Assistant…');try{const r=await fetch(c.url+'/api/',{headers:{Authorization:'Bearer '+c.token}});if(!r.ok)throw new Error('HTTP '+r.status);const w=app.contentWindow;w.HA_URL=c.url;w.HA_TOKEN=c.token;await bootV9();await w.JARVIS_V9_RUNTIME.refreshEntities();render();setStatus('Home Assistant connecté — '+(w.JARVIS_V9_RUNTIME.getCategories().reduce((n,c)=>n+c.count,0)||w.JARVIS_V9_RUNTIME.getCategories().reduce((n,c)=>n+c.entities.length,0))+' entités','ok');note('Connexion réussie')}catch(e){setStatus('Connexion impossible: '+e.message,'err');note(e.message)}}
async function selfTest(){try{await bootV9();const r=app.contentWindow.JARVIS_V9_SELF_TEST.run();log.textContent=JSON.stringify(r,null,2);setStatus(r.ok?'Self-test V9 OK: '+r.passed+'/'+r.total:'Self-test: '+r.passed+'/'+r.total,(r.ok?'ok':'err'));note(r.ok?'Self-test OK':'Self-test incomplet')}catch(e){setStatus(e.message,'err');log.textContent=e.stack||e.message}}
async function refresh(){try{const w=app.contentWindow;await w.JARVIS_V9_RUNTIME.refreshEntities();render();setStatus('États HA actualisés','ok')}catch(e){setStatus(e.message,'err')}}
function render(){const w=app.contentWindow;if(!w.JARVIS_V9_RUNTIME)return;cats.innerHTML='';for(const c of w.JARVIS_V9_RUNTIME.getCategories()){const d=document.createElement('button');d.className='cat';d.textContent=c.label;const n=document.createElement('span');n.textContent=c.count;d.appendChild(n);d.onclick=()=>{const es=c.entities||[];log.textContent=es.length?es.map(e=>e.entity_id+' — '+e.state).join('\\n'):'Aucune entité détectée';};cats.appendChild(d)}}
$('menuBtn').onclick=()=>panel.classList.toggle('open');$('connBtn').onclick=()=>panel.classList.add('open');$('connect').onclick=connect;$('self').onclick=selfTest;$('refresh').onclick=refresh;$('clear').onclick=()=>{localStorage.removeItem(KEY);$('token').value='';setStatus('Déconnecté');note('Identifiants locaux supprimés')};
const c=cfg();$('url').value=c.url||'';$('token').value=c.token||'';app.addEventListener('load',()=>{setStatus('Interface visuelle chargée — V9 prête');note('V9 prête à tester')});
</script></body></html>
