<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS V9</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050c}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#v9-menu-btn,#v9-conn{position:fixed;top:12px;z-index:60;height:46px;border:1px solid #00eaff66;border-radius:10px;background:#010912d9;color:#d9faff;font-weight:700}#v9-menu-btn{left:12px;width:46px;font-size:23px;color:#00eaff}#v9-conn{right:12px;padding:0 13px;font-size:11px;letter-spacing:1px}#v9-menu{position:fixed;top:68px;left:12px;z-index:70;width:min(390px,calc(100vw - 24px));max-height:calc(100dvh - 80px);overflow:auto;padding:14px;border:1px solid #00eaff55;border-radius:14px;background:#01070ff5;color:#d9faff;display:none;font-family:Arial}.open{display:block!important}.btn{width:100%;min-height:42px;margin-top:7px;border:1px solid #00c8ff4d;border-radius:8px;background:#0078b014;color:#d9faff;font-weight:700;font-size:10px}.title{font-weight:800;letter-spacing:2px;font-size:13px}.section{margin-top:12px;padding-top:10px;border-top:1px solid #00c8ff22}.cats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cat{padding:7px;border:1px solid #00beff26;border-radius:7px;font-size:9px}.cat b{float:right;color:#00eaff}#status{font-size:10px;margin:8px 0;color:#76bad0}.ok{color:#39ff88!important}.warn{color:#ffb000!important}.err{color:#ff3158!important}#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:#0009;font-family:Arial}#modal.open{display:flex}.box{width:min(430px,100%);padding:18px;border:1px solid #00eaff66;border-radius:14px;background:#020b16;color:#d9faff}.box h2{margin:0 0 8px;font-size:16px}.box p,.small{font-size:10px;color:#76bad0}.box label{display:block;font-size:9px;margin:12px 0 5px}.box input{width:100%;height:42px;box-sizing:border-box;border-radius:8px;border:1px solid #00c8ff40;background:#01050c;color:white;padding:0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}</style></head><body><iframe id="jarvis" src="./index.html"></iframe><button id="v9-menu-btn">☰</button><button id="v9-conn">⟳ CONNEXION</button><div id="v9-menu"><div class="title">JARVIS V9</div><div id="status">Initialisation…</div><button class="btn" id="test">📡 TEST HA WEBSOCKET</button><button class="btn" id="refresh">↻ ACTUALISER</button><button class="btn" id="self">🧪 SELF-TEST</button><div class="section"><div class="title">CATÉGORIES V9</div><div id="cats" class="cats"></div></div></div><div id="modal"><div class="box"><h2>Connexion Home Assistant</h2><p>Connexion réelle par WebSocket. Les identifiants sont enregistrés avant le test.</p><label>URL HOME ASSISTANT</label><input id="url" type="url" value="https://75arybpba4cwoe51svf3ed8ayhdid1x2.ui.nabu.casa"><label>TOKEN LONGUE DURÉE</label><input id="token" type="password"><div class="actions"><button class="btn" id="cancel">ANNULER</button><button class="btn" id="save">ENREGISTRER ET CONNECTER</button></div><div class="small">Le token reste dans le stockage local de ce navigateur.</div></div></div><script>
const $=id=>document.getElementById(id),STORE='jarvis-v9-ha-connection';let cfg={},ws=null,msgId=0,retryTimer=null;function load(){try{cfg=JSON.parse(localStorage.getItem(STORE)||'{}')}catch{cfg={}}$('url').value=cfg.url||'https://75arybpba4cwoe51svf3ed8ayhdid1x2.ui.nabu.casa';$('token').value=cfg.token||''}function st(t,c=''){const e=$('status');e.textContent=t;e.className=c}function modal(v){$('modal').classList.toggle('open',v)}function wsUrl(u){return u.trim().replace(/\/+$/,'').replace(/^http:/i,'ws:').replace(/^https:/i,'wss:')+'/api/websocket'}function closeWS(){if(retryTimer){clearTimeout(retryTimer);retryTimer=null}if(ws){try{ws.onclose=null;ws.close()}catch{}ws=null}}function connect(){load();const url=$('url').value.trim().replace(/\/+$/,''),token=$('token').value.trim();if(!/^https?:\/\//i.test(url))return st('● URL Home Assistant invalide','err');if(!token)return modal(true);localStorage.setItem(STORE,JSON.stringify({url,token}));cfg={url,token};modal(false);closeWS();st('● CONNEXION HA…','warn');try{ws=new WebSocket(wsUrl(url));ws.onopen=()=>st('● WebSocket ouverte — authentification…','warn');ws.onerror=()=>st('● Erreur WebSocket','err');ws.onclose=()=>{ws=null;if(!document.hidden){st('● HA déconnecté','warn');retryTimer=setTimeout(()=>connect(),5000)}};ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch{return}if(m.type==='auth_required'){ws.send(JSON.stringify({type:'auth',access_token:token}))}else if(m.type==='auth_ok'){st('● HOME ASSISTANT CONNECTÉ','ok');ws.send(JSON.stringify({id:++msgId,type:'get_states'}))}else if(m.type==='auth_invalid'){closeWS();st('● TOKEN REFUSÉ — vérifie le token','err')}else if(m.type==='result'&&m.id===msgId&&Array.isArray(m.result)){render(m.result);st('● HA CONNECTÉ — '+m.result.length+' ENTITÉS','ok')}}}catch(e){st('● ÉCHEC : '+e.message,'err')}}function render(arr){const m={light:0,climate:0,media_player:0,cover:0,sensor:0,switch:0,fan:0,scene:0,automation:0};arr.forEach(x=>{const d=x.entity_id?.split('.')[0];if(d in m)m[d]++});$('cats').innerHTML=Object.entries(m).map(([d,n])=>`<div class="cat">${d}<b>${n}</b></div>`).join('')}function self(){load();st(cfg.url&&cfg.token?'● IDENTIFIANTS ENREGISTRÉS':'● CONNEXION MANQUANTE',cfg.url&&cfg.token?'ok':'warn')}$('v9-menu-btn').onclick=()=>$('v9-menu').classList.toggle('open');$('v9-conn').onclick=()=>{load();modal(true)};$('cancel').onclick=()=>modal(false);$('save').onclick=connect;$('test').onclick=connect;$('refresh').onclick=connect;$('self').onclick=self;load();$('jarvis').onload=()=>{if(cfg.url&&cfg.token){st('● IDENTIFIANTS ENREGISTRÉS — CONNEXION…','warn');connect()}else st('● Ouvre CONNEXION POUR CONFIGURER','warn')};
</script></body></html>
