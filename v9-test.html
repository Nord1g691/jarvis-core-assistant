<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>JARVIS V9 — test réel</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#01050c;color:#d9faff;font-family:Arial,sans-serif}iframe{position:absolute;inset:0;width:100%;height:100%;border:0}#v9-menu-btn,#v9-conn{position:fixed;top:12px;z-index:60;height:46px;border:1px solid #00eaff66;border-radius:10px;background:#010912d9;color:#d9faff;font-weight:700}#v9-menu-btn{left:12px;width:46px;font-size:23px;color:#00eaff}#v9-conn{right:12px;padding:0 13px;font-size:11px;letter-spacing:1px}#v9-menu{position:fixed;top:68px;left:12px;z-index:70;width:min(390px,calc(100vw - 24px));max-height:calc(100dvh - 80px);overflow:auto;padding:14px;border:1px solid #00eaff55;border-radius:14px;background:#01070ff5;display:none}#v9-menu.open{display:block}.btn{min-height:42px;border:1px solid #00c8ff4d;border-radius:8px;background:#0078b014;color:#d9faff;font-weight:700;font-size:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.title{font-weight:800;letter-spacing:2px;font-size:13px}.section{margin-top:12px;padding-top:10px;border-top:1px solid #00c8ff22}.cats{display:grid;grid-template-columns:1fr 1fr;gap:5px}.cat{padding:7px;border:1px solid #00beff26;border-radius:7px;font-size:9px}.cat b{float:right;color:#00eaff}#status{font-size:10px;margin:8px 0;color:#76bad0}.ok{color:#39ff88!important}.err{color:#ff3158!important}.warn{color:#ffb000!important}#toast{position:fixed;left:50%;bottom:16px;z-index:90;transform:translateX(-50%);padding:9px 13px;border-radius:20px;background:#010912f5;display:none;font-size:10px}.show{display:block!important}#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:#0009}#modal.open{display:flex}.box{width:min(430px,100%);padding:18px;border:1px solid #00eaff66;border-radius:14px;background:#020b16}.box h2{margin:0 0 8px;font-size:16px}.box p,.small{font-size:10px;color:#76bad0}.box label{display:block;font-size:9px;margin:12px 0 5px}.box input{width:100%;height:42px;box-sizing:border-box;border-radius:8px;border:1px solid #00c8ff40;background:#01050c;color:white;padding:0 10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}</style></head><body><iframe id="jarvis" src="./index.html" title="JARVIS"></iframe><button id="v9-menu-btn">☰</button><button id="v9-conn">⟳ CONNEXION</button><div id="v9-menu"><div class="title">JARVIS V9 — CONTRÔLE</div><div id="status">Initialisation…</div><div class="grid"><button class="btn" data-action="testHA">📡 TEST HA</button><button class="btn" data-action="refresh">↻ ACTUALISER</button><button class="btn" data-action="selftest">🧪 SELF-TEST</button><button class="btn" data-action="disconnect">DÉCONNECTER</button></div><div class="section"><div class="title">CATÉGORIES V9</div><div id="cats" class="cats"></div></div></div><div id="toast"></div><div id="modal"><div class="box"><h2>Connexion Home Assistant</h2><p>Les identifiants sont enregistrés localement avant le test.</p><label>URL HOME ASSISTANT</label><input id="ha-url" type="url" placeholder="https://75arybpba4cwoe51svf3ed8ayhdid1x2.ui.nabu.casa"><label>TOKEN LONGUE DURÉE</label><input id="ha-token" type="password" placeholder="eyJ..."><div class="actions"><button class="btn" id="cancel">ANNULER</button><button class="btn" id="save">ENREGISTRER</button></div><div class="small">Après l'enregistrement, utilise TEST HA séparément.</div></div></div><script>
const frame=document.getElementById('jarvis'),menu=document.getElementById('v9-menu'),status=document.getElementById('status'),toast=document.getElementById('toast'),modal=document.getElementById('modal'),urlInput=document.getElementById('ha-url'),tokenInput=document.getElementById('ha-token'),cats=document.getElementById('cats');const STORE='jarvis-v9-ha-connection';let config={url:'',token:''},frameReady=false;
const toastMsg=(t,c='')=>{toast.textContent=t;toast.className='show '+c;setTimeout(()=>toast.className='',2500)},setStatus=(t,c='')=>{status.textContent=t;status.className=c};function loadConfig(){try{config=JSON.parse(localStorage.getItem(STORE)||'{"url":"","token":""}')||{}}catch{config={}}urlInput.value=config.url||'';tokenInput.value=config.token||''}function openModal(){loadConfig();modal.classList.add('open')}function closeModal(){modal.classList.remove('open')}function norm(u){return String(u||'').trim().replace(/\/+$/,'')}
async function connect(){const url=norm(urlInput.value),token=tokenInput.value.trim();if(!/^https?:\/\//i.test(url))return toastMsg('URL Home Assistant invalide','err');if(!token)return toastMsg('Token requis','err');config={url,token};try{localStorage.setItem(STORE,JSON.stringify(config));if(localStorage.getItem(STORE)!==JSON.stringify(config))throw new Error('Stockage local refusé');closeModal();setStatus('● Identifiants ENREGISTRÉS','ok');toastMsg('Identifiants enregistrés','ok')}catch(e){setStatus('● Enregistrement impossible','err');toastMsg(e.message,'err')}}
async function ha(path){if(!config.url||!config.token)throw Error('Configure d’abord Home Assistant');const r=await fetch(config.url+path,{headers:{Authorization:'Bearer '+config.token,'Content-Type':'application/json'}});if(!r.ok)throw Error('Home Assistant HTTP '+r.status);return r}
async function testHA(){loadConfig();if(!config.url||!config.token)return openModal();setStatus('● Test HA…','warn');try{const d=await(await ha('/api/')).json();if(d.message!=='API running')throw Error('Réponse HA inattendue');const states=await(await ha('/api/states')).json();const counts={light:0,climate:0,media_player:0,cover:0,sensor:0,switch:0};states.forEach(s=>{const d=s.entity_id.split('.')[0];if(d in counts)counts[d]++});cats.innerHTML=Object.entries(counts).map(([d,n])=>`<div class="cat">${d}<b>${n}</b></div>`).join('');setStatus('● HA EN LIGNE — '+states.length+' entités','ok');toastMsg('Home Assistant connecté','ok')}catch(e){setStatus('● HA non joignable — identifiants conservés','warn');toastMsg(e.message,'err')}}
function disconnect(){localStorage.removeItem(STORE);config={url:'',token:''};urlInput.value='';tokenInput.value='';setStatus('● Déconnecté');toastMsg('Identifiants supprimés')}
async function selfTest(){loadConfig();const ok=!!config.url&&!!config.token&&frameReady;if(ok){try{await ha('/api/')}catch{setStatus('● Identifiants présents, HA inaccessible','warn');return}}setStatus(ok?'● SELF-TEST OK':'● SELF-TEST INCOMPLET',ok?'ok':'warn')}
document.getElementById('v9-menu-btn').onclick=()=>menu.classList.toggle('open');document.getElementById('v9-conn').onclick=openModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('save').onclick=connect;document.getElementById('testHA')?.addEventListener('click',testHA);document.querySelectorAll('[data-action]').forEach(b=>{if(b.id==='testHA')return;b.onclick=()=>{const a=b.dataset.action;if(a==='refresh')return testHA();if(a==='disconnect')return disconnect();if(a==='selftest')return selfTest()}});frame.onload=()=>{frameReady=true;loadConfig();setStatus(config.url&&config.token?'● Identifiants enregistrés — TEST HA disponible':'● Non connecté — ouvre CONNEXION');toastMsg('V9 prête')};loadConfig();
</script></body></html>
